<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md">

    <!-- Role Selector Tabs -->
    <div class="flex border-b border-slate-200 mb-6 font-semibold text-sm">
        <button id="tab-student" class="flex-1 py-2 text-center text-slate-800 border-b-2 border-slate-800 font-bold transition-all">Student</button>
        <button id="tab-teacher" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-700 transition-all">Teacher</button>
        <button id="tab-admin" class="flex-1 py-2 text-center text-slate-400 hover:text-slate-700 transition-all">Admin</button>
    </div>

    <h2 id="login-title" class="text-2xl font-bold text-center text-slate-800">Student Login</h2>
    <p id="login-subtitle" class="text-xs text-center text-slate-500 mb-6">Enter your credentials to access your portal</p>

    <form id="loginForm" class="space-y-4">

        <!-- Dynamic Input 1: Register Number / Dept -->
        <div>
            <label id="label-field1" class="block text-xs font-bold text-slate-600 uppercase mb-1">Register Number</label>
            <input type="text" id="field1" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-slate-800">
        </div>

        <!-- Dynamic Input 2: Date of Birth / Password -->
        <div>
            <label id="label-field2" class="block text-xs font-bold text-slate-600 uppercase mb-1">Date of Birth</label>
            <input type="date" id="field2" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm text-slate-800 focus:outline-none focus:border-slate-800">
        </div>

        <!-- Error Banner -->
        <div id="errorMessage" class="hidden text-xs text-red-500 font-bold text-center py-2 bg-red-50 rounded-lg"></div>

        <button type="submit" class="w-full py-3 bg-slate-900 hover:bg-slate-800 text-white font-bold rounded-lg transition-all text-sm shadow-md">
            Login
        </button>
    </form>
</div>

<script src="/js/auth.js"></script>
</body>
</html>
