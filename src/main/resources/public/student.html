<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            900: '#0F172A',
                            50: '#F8FAFC'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 font-sans pb-12">

<!-- Top Sticky Mobile-First Navbar -->
<nav class="sticky top-0 z-50 bg-slate-900 text-white shadow-md border-b border-slate-800">
    <div class="px-4 py-4 max-w-4xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <h2 class="text-sm font-bold tracking-wider uppercase">Student Attendance Dashboard</h2>
        </div>
        <button onclick="logout()" class="text-xs bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-md text-slate-300 font-medium transition-colors">
            Logout
        </button>
    </div>
</nav>

<!-- Main Container Layout -->
<main class="dashboard-container max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- Summary Metrics Cards Grid -->
    <section class="summary-cards grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
        <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Register Number</h3>
            <p id="regNum" class="text-lg font-bold text-slate-900">-</p>
        </div>
        <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Total Classes</h3>
            <p id="totalClasses" class="text-lg font-bold text-slate-900">0</p>
        </div>
        <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Present</h3>
            <p id="presentCount" class="text-lg font-bold text-emerald-600">0</p>
        </div>
        <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Absent</h3>
            <p id="absentCount" class="text-lg font-bold text-rose-600">0</p>
        </div>
        <div class="card bg-white p-4 rounded-xl shadow-sm border border-slate-200 text-center col-span-2 sm:col-span-1">
            <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1">Attendance</h3>
            <p id="attendancePerc" class="text-lg font-bold text-indigo-600">0%</p>
        </div>
    </section>

    <!-- History Data Table -->
    <section class="history-section bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
        <div class="p-4 border-b border-slate-100">
            <h3 class="text-sm font-bold text-slate-900 tracking-wide uppercase">Attendance History</h3>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-sm text-slate-600">
                <thead class="bg-slate-50 text-xs text-slate-500 uppercase border-b border-slate-100 font-semibold tracking-wider">
                <tr>
                    <th class="px-4 py-3">ID</th>
                    <th class="px-4 py-3">Subject Code</th>
                    <th class="px-4 py-3">Subject Name</th>
                    <th class="px-4 py-3">Date</th>
                    <th class="px-4 py-3">Hour</th>
                    <th class="px-4 py-3">Status</th>
                </tr>
                </thead>
                <tbody id="historyTableBody" class="divide-y divide-slate-100 font-medium">
                <tr>
                    <td colspan="6" class="px-4 py-8 text-center text-slate-400 italic">Loading history...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

</main>

<script src="js/auth.js"></script>
<script src="js/student.js"></script>
</body>
</html>
