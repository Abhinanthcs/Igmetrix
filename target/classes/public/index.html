<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System Gateway</title>

    <!-- Zero-Flash Theme Initializer (Must be placed first inside <head>) -->
    <script>
        (function() {
            try {
                var saved = localStorage.getItem('theme');
                var systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = saved || (systemDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>

    <!-- Favicon Links -->
    <link rel="icon" type="image/svg+xml" href="/image/logo/logo.svg">
    <link rel="shortcut icon" href="/image/logo/logo.svg">

    <link rel="stylesheet" href="/css/tailwind.min.css">
    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/preloader.css">
</head>
<body class="bg-slate-50 min-h-screen flex flex-col justify-between text-slate-900 font-sans">

<!-- Full-Screen Preloader Overlay -->
<div id="preloader-overlay" class="preloader-overlay" role="status" aria-live="polite" aria-busy="true" aria-label="Loading page">
    <div class="preloader-content">
        <div class="preloader-spinner"></div>
        <span class="preloader-text">Loading</span>
        <span class="preloader-sr-only">Loading, please wait...</span>
    </div>
</div>

<!-- Header Grid -->
<header class="bg-slate-900 text-white py-6 shadow-md">
    <div class="container mx-auto px-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wide">ATTENDANCE MANAGEMENT HIERARCHY</h1>
        <div class="flex items-center space-x-3">
            <span class="text-xs bg-slate-800 px-3 py-1 rounded text-slate-400 font-mono hidden sm:inline-block">v2.0 Stable</span>
            <!-- Theme Toggle Button -->
            <button type="button" class="theme-toggle-btn" data-theme-toggle aria-label="Toggle theme">
                <!-- Sun Icon -->
                <svg class="theme-toggle-icon icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <!-- Moon Icon -->
                <svg class="theme-toggle-icon icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- Main Content Container -->
<main class="container mx-auto px-4 py-16 flex-grow flex items-center justify-center">
    <div class="max-w-xl w-full bg-white rounded-xl shadow-xl border border-slate-100 p-8 text-center theme-surface">
        <div class="mb-6 flex justify-center">
            <div class="p-4 bg-emerald-50 rounded-full text-emerald-500">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                </svg>
            </div>
        </div>

        <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight mb-2">Unified Portal Gateway</h2>
        <p class="text-slate-500 mb-8 max-w-sm mx-auto">Access secure institutional routes via automated cryptographic payload translation.</p>

        <div class="space-y-4">
            <a href="/login.html" class="block w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-3 px-4 rounded-lg shadow transitioned duration-150 ease-in-out">
                Proceed to Secure Login
            </a>
        </div>

        <!-- Pre-auth checking agent -->
        <script type="module">
            import { redirectBasedOnRole } from './js/auth.js';
            const currentRole = localStorage.getItem('user_role');
            const token = localStorage.getItem('jwt_token');
            if (currentRole && token) {
                const statusBanner = document.createElement('div');
                statusBanner.className = 'mt-4 text-xs text-emerald-500 font-medium bg-emerald-50 p-2 rounded';
                statusBanner.textContent = `Active user payload detected: [${currentRole.toUpperCase()}]. Auto-routing enabled.`;
                document.querySelector('main div').appendChild(statusBanner);
                setTimeout(() => redirectBasedOnRole(currentRole), 1200);
            }
        </script>
    </div>
</main>

<!-- Footer System Status -->
<footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
    <p>&copy; 2026 Institutional Attendance System. Authorized access parameters enforced.</p>
</footer>

<script src="/js/theme.js"></script>
<script src="/js/preloader.js"></script>
</body>
</html>
